<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Apps & Games</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&display=swap&family=Poppins:wght@500;600&family=Share+Tech&display=swap&family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>
<script>
    window.addEventListener("load", () => {
        const loader = document.querySelector(".loader");
        
        loader.classList.add("loader-hidden");
        document.getElementById('page').removeAttribute("class", "collapse");
        
        loader.addEventListener("transitionend", () => {
            document.body.removeChild("loader");
        })
    })
</script>
<body>
    <div id="header-placeholder"></div>
    <div id="page" class="collapse">
        <div class="container my-3 text-center">
            <h1 class="h-font">Rock Paper Scissors</h1>
            <p>Welcome to Rock Paper Scissors! In this game, you will be given 5 hearts. Your goal is to get as many wins as possible until you run out of hearts.</p>
            <button id="play-btn">Play</button>
        </div>
    </div>
    <div id="game" class="collapse">
        <div class="container my-3 text-center">
            <h1 class="h-font">Hearts left: 
                <a id="hearts" class="text-danger text-decoration-none"></a>
            </h1>
            <h1 class="h-font">Highscore: 
                <a id="highscore" class="text-success text-decoration-none"></a>
            </h1>
            <h1 class="h-font">Wins: 
                <a id="wins" class="text-success text-decoration-none"></a>
            </h1>
            <p id="text-display">Choose your hand:</p>
            <div id="hand-choices">
                <button id="rock-btn" class="btn btn-primary">Rock</button>
                <button id="paper-btn" class="btn btn-primary">Paper</button>
                <button id="scissors-btn" class="btn btn-primary">Scissors</button>
            </div>
            <div id="continue" class="collapse">
                <button id="continue-btn" class="btn btn-primary">Continue</button>
            </div>
            <button id="restart-btn" class="collapse">Try Again</button>
        </div>
        <div class="container my-3 d-flex">
            <div class="rounded-box mx-2" style="top:0">
                <h5 class="h-font">YOUR HAND</h5>
                <img id="player_rock" class="collapse" width="50%" src="../images/rock.png" alt="Rock">
                <img id="player_paper" class="collapse" width="50%" src="../images/paper.png" alt="Paper">
                <img id="player_scissors" class="collapse" width="50%" src="../images/scissors.png" alt="Scissors">
            </div>
            <div class="rounded-box mx-2" style="top:0">
                <h5 class="h-font">COMPUTER'S HAND</h5>
                <img id="com_rock" class="collapse" width="50%" src="../images/rock.png" alt="Rock">
                <img id="com_paper" class="collapse" width="50%" src="../images/paper.png" alt="Paper">
                <img id="com_scissors" class="collapse" width="50%" src="../images/scissors.png" alt="Scissors">
            </div>
        </div>
    </div>

    <div class="loader"></div>
    <script src="../scripts/play.js"></script>
</body>
</html>
