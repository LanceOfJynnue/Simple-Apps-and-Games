<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Apps & Games</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&display=swap&family=Poppins:wght@500;600&family=Share+Tech&display=swap&family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>
<script>
    window.addEventListener("load", () => {
        const loader = document.querySelector(".loader");
        
        loader.classList.add("loader-hidden");
        document.getElementById('page').removeAttribute("class", "collapse");
        
        loader.addEventListener("transitionend", () => {
            document.body.removeChild("loader");
        })
    })
</script>
<body>
    <div id="header-placeholder"></div>
    <div id="page" class="collapse">
        <div class="container my-3 text-center">
            <h1 class="h-font">Welcome to Simple Apps & Games!</h1>
            <p>Click the linked texts of the app or game you want to try!</p>
            <!--button id="action-btn">Click Me</button-->
        </div>
        <div class="container my-3 d-flex align-items-center">
            <div class="rounded-box mx-2">
                <h1 class="h-font">APPS</h1>
                <p>Click the linked texts of the app or game you want to try!</p>
                <!--button id="action-btn">Click Me</button-->
            </div>
            <div class="rounded-box mx-2">
                <h1 class="h-font">GAMES</h1>
                <a class="btn btn-primary mb-1" href="./games/rps.html">Rock Paper Scissors</a>
                <a class="btn btn-secondary mb-1" href="">Higher Lower</a>
                <a class="btn btn-secondary mb-1" href="">Guess the Number</a>
                <a class="btn btn-secondary mb-1" href="">Black Jack</a>
                <a class="btn btn-secondary mb-1" href="">Tic-Tac-Toe</a>
                <a class="btn btn-secondary mb-1" href="">Wild West Duel</a>
            </div>
        </div>
    </div>
    <div class="loader"></div>
    <script src="scripts/js_games.js"></script>
</body>
</html>
